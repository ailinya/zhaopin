[project]
name = "interview-backend"
version = "0.1.0"
description = "AI 智能招聘面试系统后端 - FastAPI + LangGraph + SQLAlchemy 2.0"
requires-python = ">=3.11,<3.13"

dependencies = [
    # ===== Web 框架 =====
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",          # 文件上传

    # ===== 数据校验 / 配置 =====
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",

    # ===== 数据库 =====
    "sqlalchemy>=2.0.0",                # 同步 ORM
    "alembic>=1.13.0",                  # 迁移工具

    # ===== 安全 / 鉴权 =====
    "passlib[bcrypt]>=1.7.4",           # 密码 hash
    "bcrypt<4.0",                       # 锁版本：passlib 1.7.4 与 bcrypt 4.x 不兼容
    "python-jose[cryptography]>=3.3.0", # JWT
    "pyjwt>=2.9.0",                     # JWT 替代选择

    # ===== AI / LLM =====
    "openai>=1.75.0",                   # OpenAI 兼容 SDK
    "langchain>=0.3.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-sqlite>=2.0.0",  # LangGraph checkpoint

    # ===== 语音识别 =====
    "openai-whisper>=20240930",
    "torch>=2.0.0",                     # Whisper 依赖

    # ===== 文件解析 =====
    "pypdf2>=3.0.1",                    # PDF 文本提取
    "python-docx>=1.1.0",               # Word 文本提取

    # ===== PDF 生成 =====
    "weasyprint>=65.0",
    "jinja2>=3.1.6",

    # ===== 调度 =====
    "apscheduler>=3.10.0",              # 进程内调度

    # ===== HTTP 客户端 =====
    "httpx>=0.27.0",
    "aiofiles>=24.1.0",

    # ===== SSE =====
    "sse-starlette>=2.1.0",

    # ===== 日志 =====
    "structlog>=24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",                       # Linter
    "mypy>=1.11.0",                      # Type checker
    "ipython>=8.0.0",                    # 调试
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]  # 行长限制、方法默认参数

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
# basetemp 在 conftest.py 里通过 pytest_configure 动态设置（Windows 兼容）

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "ipython>=8.0.0",
]