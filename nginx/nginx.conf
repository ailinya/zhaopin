# ============================================================
# Nginx 反向代理配置（SSE 优化版）
#
# 关键参数（§13.6）：
# 1. proxy_buffering off    —— SSE 不能缓冲
# 2. proxy_read_timeout 1h  —— SSE 长连接超时
# 3. proxy_http_version 1.1 + Connection ""  —— keepalive
# ============================================================

user  nginx;
worker_processes  1;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    sendfile        on;
    keepalive_timeout  65;

    # ===== 上游后端 =====
    upstream api_backend {
        server api:8000;
        keepalive 32;
    }

    # ===== HTTPS server（生产）=====
    server {
        listen 443 ssl;
        server_name your-domain.com;  # TODO: 替换为实际域名

        ssl_certificate     /etc/nginx/ssl/your-domain.pem;       # TODO: 替换
        ssl_certificate_key /etc/nginx/ssl/your-domain.key;       # TODO: 替换
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ----- 静态文件（Vite 构建产物）-----
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;  # SPA 路由 fallback
        }

        # ----- SSE 端点：禁用缓冲 + 长连接 -----
        location ~ ^/api/interviews/[0-9]+/events$ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_buffering off;            # ← 关键：禁用缓冲
            proxy_cache off;
            proxy_read_timeout 1h;          # ← 关键：1 小时超时
            proxy_send_timeout 1h;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----- 普通 API -----
        location /api/ {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 上传文件大小限制（与后端 MAX_FILE_SIZE_MB 一致）
            client_max_body_size 50M;
        }
    }

    # ===== HTTP server（重定向到 HTTPS）=====
    server {
        listen 80;
        server_name your-domain.com;  # TODO: 替换

        # ACME challenge 路径（Let's Encrypt 用）
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 其他全部重定向到 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }
}